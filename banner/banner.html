<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LinkedIn banner</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Pacifico&display=block">
  <style>
    /* LinkedIn personal profile banner: 1584 x 396 px.
       On desktop the round profile photo overlaps the bottom left corner
       (roughly the left 420 px), so the content sits right of center. */
    :root {
      --navy: #0f1d2b;
      --glow: #1b3247;
      --sand: #eee7da;
      --muted: #9db0c2;
      --amber: #e8a33d;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1584px; height: 396px; overflow: hidden; }
    body {
      position: relative;
      background: radial-gradient(900px 500px at 70% 0%, var(--glow), transparent 70%), var(--navy);
      color: var(--sand);
      font-family: "Merriweather", Georgia, serif;
    }
    .entry {
      position: absolute;
      left: 500px;
      right: 80px;
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .headword { font-weight: 700; font-size: 92px; line-height: 1; letter-spacing: 0.01em; }
    .phonetic { color: var(--muted); font-size: 24px; margin-top: 12px; }
    .definition { color: var(--amber); font-size: 30px; line-height: 1.3; margin-top: 20px; max-width: 620px; }
    .site { position: absolute; right: 80px; bottom: 28px; color: var(--muted); font-size: 18px; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="entry">
    <p class="headword">ver&middot;sa&middot;tile</p>
    <p class="phonetic">/&#712;v&#601;rs&#601;dl/ <i>adjective</i></p>
    <p class="definition">able to adapt or be adapted to many different functions or activities.</p>
  </div>
  <p class="site">philgutowski.com</p>
</body>
</html>
