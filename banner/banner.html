<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LinkedIn banner</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Pacifico&display=block">
  <style>
    /* LinkedIn personal profile banner: 1584 x 396 px.
       LinkedIn lays the round profile photo over the left third of the banner
       on desktop (about 560 px at this size, more on narrow windows), and the
       edit pencil sits in the top right corner. The content is centered in the
       clear region between them. */
    :root {
      --paper: #f6f1e8;
      --glow: #ffffff;
      --ink: #17303f;
      --slate: #526676;
      --copper: #9c5211;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1584px; height: 396px; overflow: hidden; }
    body {
      position: relative;
      background: radial-gradient(900px 500px at 70% 0%, var(--glow), transparent 70%), var(--paper);
      color: var(--ink);
      font-family: "Merriweather", Georgia, serif;
    }
    .entry {
      position: absolute;
      left: 660px;
      right: 110px;
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .headword { font-weight: 700; font-size: 92px; line-height: 1; letter-spacing: 0.01em; }
    .phonetic { color: var(--slate); font-size: 24px; margin-top: 12px; }
    .definition { color: var(--copper); font-size: 30px; line-height: 1.3; margin-top: 20px; max-width: 620px; }
    .site { position: absolute; right: 80px; bottom: 24px; color: var(--slate); font-size: 18px; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="entry">
    <p class="headword">ver&middot;sa&middot;tile</p>
    <p class="phonetic">/&#712;v&#601;rs&#601;dl/ <i>adjective</i></p>
    <p class="definition">able to adapt or be adapted to many different functions or activities.</p>
  </div>
  <p class="site">philgutowski.com</p>
</body>
</html>
